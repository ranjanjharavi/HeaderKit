<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeaderKit store artwork source</title>
  <link rel="stylesheet" href="store-screenshot.css">
</head>
<body>
  <main id="artboard" class="artboard">
    <div class="brand"><img src="/extension/icons/headerkit-128.png" width="48" height="48" alt=""><span>HeaderKit</span></div>
    <div class="copy"><h1 id="headline"></h1><p id="caption"></p><ul id="benefits"></ul></div>
    <div class="product"><iframe id="productPreview" title="Live HeaderKit interface with illustrative data"></iframe></div>
    <p class="footnote">Illustrative test data · Chrome extension</p>
    <svg class="promo-symbol" viewBox="0 0 600 240" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M65 120h92m-44 0v-24a28 28 0 0 1 28-28h24m-10 28 24 24-24 24m24-24h33"/>
        <circle cx="55" cy="120" r="13"/><circle cx="225" cy="120" r="13"/>
        <path opacity=".65" d="M265 120h32c40 0 35-60 80-60h23M265 120h135M265 120h32c40 0 35 60 80 60h23"/>
        <rect x="415" y="35" width="133" height="46" rx="23"/><rect x="415" y="97" width="133" height="46" rx="23"/><rect x="415" y="159" width="133" height="46" rx="23"/>
      </g>
      <g fill="currentColor"><circle cx="438" cy="58" r="11"/><circle cx="438" cy="120" r="11"/><circle cx="525" cy="182" r="11" opacity=".5"/></g>
    </svg>
  </main>
  <script>
    const views = {
      popup: { title: 'Modify request headers.\nKeep changes scoped.', caption: 'Test headers on an exact HTTPS host.', benefits: ['Exact HTTPS hosts', 'Visible On and Paused states', 'Local settings. No account.'], page: 'popup' },
      manager: { title: 'Switch profiles.\nKeep rules organized.', caption: 'One workspace for environments, rules, and automatic expiry.', page: 'options' },
      scope: { title: 'Target API calls.\nLimit the scope.', caption: 'An exact HTTPS host, an optional path, and fetch/XHR matching.', page: 'options' },
      access: { title: 'Review site access.\nStay in control.', caption: 'See which rules each grant covers. Revoke access and keep rules saved.', page: 'options' },
      profiles: { title: 'Copy a setup.\nStart with rules paused.', caption: 'Create, rename, and duplicate separate environment profiles.', page: 'options' },
      promo: { title: '', caption: '' },
      marquee: { title: '', caption: '' },
      social: { title: 'Request headers\nfor focused API testing.', caption: 'Exact hosts. Profiles. Automatic expiry.', page: 'popup' }
    };
    const requestedView = new URLSearchParams(location.search).get('view') || 'popup';
    const name = Object.hasOwn(views, requestedView) ? requestedView : 'popup';
    const view = views[name];
    document.getElementById('artboard').classList.add(name);
    document.getElementById('headline').textContent = view.title;
    document.getElementById('caption').textContent = view.caption;
    for (const benefit of view.benefits || []) {
      const li = document.createElement('li'); li.textContent = benefit;
      document.getElementById('benefits').append(li);
    }
    if (view.page) document.getElementById('productPreview').src = `/extension/${view.page}/index.html`;
    else document.getElementById('productPreview').remove();
  </script>
</body>
</html>
