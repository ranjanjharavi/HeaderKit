<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>ReqKit manager harness</title></head>
<body>
  <script>
    (async () => {
      const previewParameters = new URLSearchParams(location.search);
      const storage = {
        privacyConsentVersion: 1,
        profiles: [
          { id: 'default', name: 'Default', createdAt: 0, defaultDurationMs: null },
          { id: 'staging', name: 'Staging', createdAt: 1, defaultDurationMs: null },
          { id: 'development', name: 'Development', createdAt: 2, defaultDurationMs: null }
        ],
        activation: {
          masterEnabled: true,
          profileId: 'default',
          lastProfileId: 'default',
          expiresAt: null,
          durationMs: null,
          untilBrowserClose: false
        },
        headerRules: previewParameters.has('empty') ? [] : [
          { id: 1, domain: 'api.example.com', headerName: 'Authorization', headerValue: 'Bearer secret', enabled: true, profileId: 'default' },
          { id: 2, domain: 'api.example.com', headerName: 'X-ReqKit-Debug', headerValue: 'enabled', enabled: true, profileId: 'default' },
          { id: 3, domain: 'accounts.example.com', headerName: 'X-Client', headerValue: 'reqkit', enabled: false, profileId: 'default' },
          { id: 4, domain: 'staging.example.com', headerName: 'X-Environment', headerValue: 'staging', enabled: true, profileId: 'staging' },
          { id: 5, domain: 'staging.example.com', headerName: 'X-Trace', headerValue: 'verbose', enabled: false, profileId: 'staging' },
          { id: 6, domain: 'localhost', headerName: 'X-Debug', headerValue: 'true', enabled: true, profileId: 'development' }
        ]
      };

      if (previewParameters.has('campaign')) {
        const { createStoreData } = await import('./store-data.js');
        Object.assign(storage, createStoreData());
      }

      let runtimeRules = storage.headerRules;
      let runtimeActivation = storage.activation;
      const permissionEvents = { added: [], removed: [] };
      const grantedOrigins = previewParameters.has('noaccess') ? [] : previewParameters.has('campaign') ? [
        'https://api.example.com/*',
        'https://qa.example.com/*'
      ] : [
        'https://api.example.com/*',
        'https://accounts.example.com/*',
        'https://staging.example.com/*',
        'https://localhost/*',
        'https://unused.example.net/*'
      ];
      if (!previewParameters.has('noaccess') && previewParameters.has('broad')) {
        grantedOrigins.push('https://*/*');
      }
      window.__REQKIT_CHROME_STUB__ = {
        runtime: {
          lastError: null,
          getURL(path) { return `/extension/${path}`; },
          sendMessage(message, callback) {
            if (message.type === 'reqkit:rules:get') {
              callback({ ok: true, rules: runtimeRules });
              return;
            }
            if (message.type === 'reqkit:rules:commit') {
              runtimeRules = message.rules;
              storage.headerRules = runtimeRules;
              callback({ ok: true, rules: runtimeRules });
              return;
            }
            if (message.type === 'reqkit:activation:get') {
              callback({ ok: true, activation: runtimeActivation });
              return;
            }
            if (message.type === 'reqkit:activation:set') {
              runtimeActivation = message.activation;
              storage.activation = runtimeActivation;
              callback({ ok: true, activation: runtimeActivation });
              return;
            }
            callback({ ok: true });
          }
        },
        storage: {
          local: {
            get(query, callback) {
              if (Array.isArray(query)) {
                callback(Object.fromEntries(query.filter((key) => key in storage).map((key) => [key, storage[key]])));
                return;
              }
              callback({ ...query, ...storage });
            },
            set(value, callback) {
              Object.assign(storage, value);
              callback();
            }
          },
          onChanged: { addListener() {} }
        },
        permissions: {
          onAdded: { addListener(listener) { permissionEvents.added.push(listener); } },
          onRemoved: { addListener(listener) { permissionEvents.removed.push(listener); } },
          getAll(callback) {
            callback({ origins: [...grantedOrigins] });
          },
          request(details, callback) {
            document.documentElement.dataset.permissionRequest = details.origins[0];
            const newlyGranted = details.origins.filter((origin) => !grantedOrigins.includes(origin));
            grantedOrigins.push(...newlyGranted);
            callback(true);
            if (newlyGranted.length) {
              permissionEvents.added.forEach((listener) => listener({ origins: newlyGranted }));
            }
          },
          remove(details, callback) {
            const removed = [];
            details.origins.forEach((origin) => {
              const index = grantedOrigins.indexOf(origin);
              if (index !== -1) {
                grantedOrigins.splice(index, 1);
                removed.push(origin);
              }
            });
            callback(removed.length > 0);
            if (removed.length) {
              permissionEvents.removed.forEach((listener) => listener({ origins: removed }));
            }
          }
        }
      };
      window.chrome = window.__REQKIT_CHROME_STUB__;

      const cacheBust = Date.now();
      const markup = await fetch('/extension/options/index.html', { cache: 'no-store' }).then((response) => response.text());
      document.open();
      document.write(markup
        .replace('<head>', '<head><base href="/extension/options/">')
        .replace('href="../shared/styles/index.css"', `href="../shared/styles/index.css?v=${cacheBust}"`)
        .replace('href="options.css"', `href="options.css?v=${cacheBust}"`)
        .replace('<script type="module" src="main.js"></' + 'script>', `<script>window.chrome = window.__REQKIT_CHROME_STUB__;</` + `script><script type="module" src="main.js?v=${cacheBust}"></` + 'script>'));
      document.close();
    })();
  </script>
</body>
</html>
