<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>ReqKit popup harness</title></head>
<body>
  <script>
    (async () => {
      const previewParameters = new URLSearchParams(location.search);
      const storage = previewParameters.has('store')
        ? { privacyConsentVersion: 1 }
        : {};

      if (previewParameters.has('headers')) {
        Object.assign(storage, {
          profiles: [
            { id: 'default', name: 'Default', createdAt: 0, defaultDurationMs: null },
            { id: 'staging', name: 'Staging', createdAt: 1, defaultDurationMs: null }
          ],
          activation: {
            masterEnabled: true,
            profileId: 'default',
            lastProfileId: 'default',
            expiresAt: null,
            durationMs: null,
            untilBrowserClose: false
          },
          headerRules: [
            { id: 1, domain: 'example.com', headerName: 'X-ReqKit-Review', headerValue: 'enabled', enabled: true, profileId: 'default' },
            { id: 2, domain: 'example.com', headerName: 'X-Debug-Mode', headerValue: 'verbose', enabled: false, profileId: 'default' },
            { id: 3, domain: 'staging.example.com', headerName: 'X-Environment', headerValue: 'staging', enabled: true, profileId: 'staging' }
          ]
        });
      }

      if (previewParameters.has('campaign')) {
        const { createStoreData } = await import('./store-data.js');
        Object.assign(storage, createStoreData());
      }

      let runtimeRules = storage.headerRules || [];
      let runtimeActivation = storage.activation;
      const grantedOrigins = previewParameters.has('noaccess')
        ? []
        : previewParameters.has('campaign')
          ? ['https://api.example.com/*', 'https://qa.example.com/*']
          : ['https://example.com/*', 'https://staging.example.com/*'];
      window.__REQKIT_CHROME_STUB__ = {
        runtime: {
          lastError: null,
          getURL(path) { return `/extension/${path}`; },
          openOptionsPage(callback) { callback(); },
          sendMessage(message, callback) {
            if (message.type === 'reqkit:rules:commit') {
              runtimeRules = message.rules;
              callback({ ok: true, rules: runtimeRules });
              return;
            }
            if (message.type === 'reqkit:activation:set') {
              runtimeActivation = message.activation;
              storage.activation = runtimeActivation;
              callback({ ok: true, activation: runtimeActivation });
              return;
            }
            if (message.type === 'reqkit:activation:get') {
              callback({ ok: true, activation: runtimeActivation });
              return;
            }
            callback({ ok: true, rules: runtimeRules });
          }
        },
        storage: {
          local: {
            get(query, callback) {
              if (Array.isArray(query)) {
                callback(Object.fromEntries(query.filter((key) => key in storage).map((key) => [key, storage[key]])));
                return;
              }
              callback({ ...query, ...storage });
            },
            set(value, callback) {
              Object.assign(storage, value);
              callback();
            }
          },
          onChanged: { addListener() {} }
        },
        permissions: {
          getAll(callback) {
            callback({ origins: grantedOrigins });
          },
          request(details, callback) {
            document.documentElement.dataset.permissionRequest = details.origins[0];
            if (!grantedOrigins.includes(details.origins[0])) {
              grantedOrigins.push(details.origins[0]);
            }
            callback(true);
          },
          remove(_details, callback) { callback(true); }
        },
        tabs: {
          query(_details, callback) { callback([{ id: 1, url: previewParameters.has('campaign') ? 'https://api.example.com/api/v1/users' : 'https://example.com/app?view=list#details' }]); },
          create(details, callback) {
            document.documentElement.dataset.createdTabUrl = details.url;
            callback({ id: 2, ...details });
          }
        }
      };
      if (parent !== window) {
        parent.__REQKIT_CHROME_STUB__ = window.__REQKIT_CHROME_STUB__;
      }
      window.chrome = window.__REQKIT_CHROME_STUB__;

      const cacheBust = Date.now();
      const markup = await fetch('/extension/popup/index.html', { cache: 'no-store' }).then((response) => response.text());
      document.open();
      document.write(markup
        .replace('<head>', '<head><base href="/extension/popup/">')
        .replace('href="../shared/styles/index.css"', `href="../shared/styles/index.css?v=${cacheBust}"`)
        .replace('href="popup.css"', `href="popup.css?v=${cacheBust}"`)
        .replace('<script type="module" src="main.js"></' + 'script>', '<script>window.chrome = window.__REQKIT_CHROME_STUB__ || parent.__REQKIT_CHROME_STUB__;</' + `script><script type="module" src="main.js?v=${cacheBust}"></` + 'script>'));
      document.close();
    })();
  </script>
</body>
</html>
