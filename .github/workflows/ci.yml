name: CI

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  checks:
    name: Tests and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      # Report formatting problems even when a test fails.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
